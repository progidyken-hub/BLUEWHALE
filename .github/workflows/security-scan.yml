name: Security Scan

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  push:
    branches: [main]
  pull_request:
    paths:
      # Source code and rules, so SAST (Semgrep) runs on every code change.
      - 'packages/**'
      - '.semgrep.yml'
      # Dependency manifests, for the audit jobs.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/core-go/go.mod'
      - 'packages/core-go/go.sum'
      - 'packages/core-dart/pubspec.yaml'
      - 'packages/core-dart/pubspec.lock'
      - 'examples/prism-core/Cargo.toml'
      - 'examples/rust-address-fuzzer/Cargo.toml'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  audit-npm:
    name: npm audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

  audit-go:
    name: govulncheck (core-go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        working-directory: packages/core-go

  audit-dart:
    name: dart dependency audit (core-dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check package dependencies
        run: dart pub get
        working-directory: packages/core-dart

  audit-rust-prism:
    name: cargo audit (prism-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
        working-directory: examples/prism-core

  audit-rust-fuzzer:
    name: cargo audit (rust-address-fuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
        working-directory: examples/rust-address-fuzzer

  semgrep-scan:
    name: semgrep static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v7

      # OWASP Top 10 registry pack plus language packs plus the project
      # rules in .semgrep.yml (insecure randomness, unchecked returns,
      # timing-unsafe comparisons, Stellar address validation).
      # --error fails the job on any finding.
      - name: Run Semgrep (OWASP Top 10 + Bluewhale rules)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/golang \
            --config .semgrep.yml \
            --metrics=off \
            --sarif --output semgrep.sarif \
            --error \
            packages/

      - name: Print findings
        if: failure()
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/typescript \
            --config p/golang \
            --config .semgrep.yml \
            --metrics=off \
            packages/

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  codeql-scan:
    name: codeql static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'go']
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  security-gate:
    name: security gate
    runs-on: ubuntu-latest
    # Every job whose result is checked below must be listed here, or its
    # result reads as empty and the gate always fails.
    needs: [secret-scan, audit-npm, audit-go, audit-dart, audit-rust-prism, audit-rust-fuzzer, semgrep-scan, codeql-scan]
    if: always()
    steps:
      - name: Enforce all audits passed
        if: >
          needs.secret-scan.result != 'success' ||
          needs.audit-npm.result != 'success' ||
          needs.audit-go.result != 'success' ||
          needs.audit-dart.result != 'success' ||
          needs.audit-rust-prism.result != 'success' ||
          needs.audit-rust-fuzzer.result != 'success' ||
          needs.semgrep-scan.result != 'success' ||
          needs.codeql-scan.result != 'success'
        run: |
          echo "::error::Security scan failed — at least one audit or static analysis failed."
          echo "::error::gitleaks:           ${{ needs.secret-scan.result }}"
          echo "::error::npm audit:          ${{ needs.audit-npm.result }}"
          echo "::error::govulncheck go:     ${{ needs.audit-go.result }}"
          echo "::error::dart audit:         ${{ needs.audit-dart.result }}"
          echo "::error::cargo audit prism:  ${{ needs.audit-rust-prism.result }}"
          echo "::error::cargo audit fuzzer: ${{ needs.audit-rust-fuzzer.result }}"
          echo "::error::semgrep:            ${{ needs.semgrep-scan.result }}"
          echo "::error::codeql:             ${{ needs.codeql-scan.result }}"
          exit 1

