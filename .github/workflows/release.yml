name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 8

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --- SBOM generation (runs on tagged releases and when changesets publishes) ---

      - name: Generate SBOM – bluewhale-core (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        if: steps.changesets.outputs.published == 'true' || startsWith(github.ref, 'refs/tags/')
        with:
          path: ./packages/bluewhale-core
          artifact-name: sbom-bluewhale-core.cdx.json
          output-file: ./sbom-bluewhale-core.cdx.json
          format: cyclonedx-json

      - name: Generate SBOM – bluewhale (React UI, CycloneDX JSON)
        uses: anchore/sbom-action@v0
        if: steps.changesets.outputs.published == 'true' || startsWith(github.ref, 'refs/tags/')
        with:
          path: ./packages/bluewhale
          artifact-name: sbom-bluewhale.cdx.json
          output-file: ./sbom-bluewhale.cdx.json
          format: cyclonedx-json

      - name: Generate SBOM – core-go (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        if: steps.changesets.outputs.published == 'true' || startsWith(github.ref, 'refs/tags/')
        with:
          path: ./packages/core-go
          artifact-name: sbom-core-go.cdx.json
          output-file: ./sbom-core-go.cdx.json
          format: cyclonedx-json

      - name: Generate SBOM – core-dart (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        if: steps.changesets.outputs.published == 'true' || startsWith(github.ref, 'refs/tags/')
        with:
          path: ./packages/core-dart
          artifact-name: sbom-core-dart.cdx.json
          output-file: ./sbom-core-dart.cdx.json
          format: cyclonedx-json

      - name: Attach SBOM files as release assets
        uses: anchore/sbom-action/publish-sbom@v0
        if: steps.changesets.outputs.published == 'true' || startsWith(github.ref, 'refs/tags/')

