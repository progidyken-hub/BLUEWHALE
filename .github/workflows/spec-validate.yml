name: spec-validate

on:
  pull_request:
    paths:
      - "spec/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install ajv
      - run: node spec/validate.js
      - run: node scripts/check-regex-spec.js
        env:
          REGEX_SPEC_REQUIRE_PERL: "1"
      - run: node scripts/check-spec-version-bump.js
      - run: node scripts/check-vectors-sync.js
      - run: node scripts/generate-parity-matrix.js --check
