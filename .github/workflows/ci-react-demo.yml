name: ci-react-demo

on:
  pull_request:
    paths:
      - "examples/react-demo/**"
      - "packages/bluewhale/**"
      - ".github/workflows/ci-react-demo.yml"

concurrency:
  group: ci-react-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: React Demo – TypeScript & Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/react-demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: examples/react-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile + Vite build
        run: npm run build

  visual-regression:
    name: React Demo – Playwright visual regression
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: examples/react-demo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: examples/react-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build bluewhale package
        working-directory: packages/bluewhale
        run: npm ci && npm run build

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/react-demo/playwright-report/
          retention-days: 7
