name: ci-react-demo

on:
  pull_request:
    paths:
      - "examples/react-demo/**"
      - "examples/react-deposit-form/**"
      - "packages/bluewhale/**"
      - ".github/workflows/ci-react-demo.yml"

concurrency:
  group: ci-react-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: React Demo – TypeScript & Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/react-demo

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: examples/react-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile + Vite build
        run: npm run build

  react-deposit-form:
    name: React Hook Form deposit example – TypeScript & Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build local Bluewhale packages
        run: |
          pnpm --filter @redishfish/bluewhale-core build
          pnpm --filter @redishfish/bluewhale build
      - name: Install example dependencies
        run: npm ci
        working-directory: examples/react-deposit-form
      - name: TypeScript compile + Vite build
        run: npm run build
        working-directory: examples/react-deposit-form
