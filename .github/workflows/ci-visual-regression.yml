name: ci-visual-regression

on:
  pull_request:
    paths:
      - "examples/react-demo/**"
      - "packages/bluewhale/**"
      - ".github/workflows/ci-visual-regression.yml"

concurrency:
  group: ci-visual-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual-regression:
    name: React Demo – Playwright visual regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            examples/react-demo/package-lock.json

      - name: Install workspace dependencies (builds bluewhale)
        run: pnpm install
        working-directory: .

      - name: Build @redishfish/bluewhale
        run: pnpm --filter @redishfish/bluewhale build

      - name: Install react-demo npm dependencies
        run: npm ci
        working-directory: examples/react-demo

      - name: Install Playwright Chromium + system deps
        run: npx playwright install chromium --with-deps
        working-directory: examples/react-demo

      - name: Run visual regression tests
        run: npx playwright test
        working-directory: examples/react-demo

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/react-demo/playwright-report/
          retention-days: 7

      - name: Upload test results (diffs) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: examples/react-demo/test-results/
          retention-days: 7
